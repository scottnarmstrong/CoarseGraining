version: "v0.4"

project:
  name: "CoarseGraining"
  description: >-
    A Lean formalization of the coarse-graining approach to quantitative
    stochastic homogenization of divergence-form elliptic equations:
    function-space, deterministic, probabilistic, and homogenization-scale
    theory up to the quenched minimal-scale theorem. The public main result
    is a uniformly elliptic, isotropic specialization of the quenched
    homogenization comparison estimate in Armstrong-Kuusi,
    "Renormalization Group and Elliptic Homogenization in High Contrast"
    (Inventiones Mathematicae, 2025), independently checked using
    Audit/QuenchedComparison/comparator.json, together with four further
    comparator-checked specializations under Audit/.
  authors:
    - "Scott Armstrong"
    - "Tuomo Kuusi"
  responsible_maintainers:
    - "Scott Armstrong"
    - "Tuomo Kuusi"
  license: "Apache-2.0"

classification:
  arxiv: ["math.AP"]
  msc2020: ["35B27", "60K37", "35J15"]

sources:
  - title: "Coarse-Graining Theory for Elliptic Equations"
    authors:
      - "Scott Armstrong"
      - "Tuomo Kuusi"
    id: ""                      # TODO: arXiv ID / DOI when the manuscript is public
    type: "manuscript"
    relationship: "formalizes"
    note: >-
      The manuscript under formalization. Every theorem it states is
      formalized; narrower or extra-hypothesis cases are flagged in
      manuscript footnotes (see fidelity.divergences).
    license: "all rights reserved"
    author_contacted: "n/a"     # the formalizers are the authors of the source
    prior_work: ""
  - title: "Renormalization Group and Elliptic Homogenization in High Contrast"
    authors:
      - "Scott Armstrong"
      - "Tuomo Kuusi"
    id: "doi:10.1007/s00222-025-01370-9"
    type: "journal article"
    relationship: "formalizes"
    note: >-
      The public main result specializes this paper's quenched homogenization
      comparison estimate to uniformly elliptic, isotropic laws, with the
      Sobolev exponent fixed to s=3/4. It is
      comparator checked via Audit/QuenchedComparison/.
    license: ""
    author_contacted: "n/a"
    prior_work: ""

related_formalizations: []

status:
  scope: >-
    A Lean 4 / Mathlib formalization of the coarse-graining approach to
    quantitative stochastic homogenization of divergence-form elliptic equations:
    function-space, deterministic, probabilistic, and homogenization-scale theory
    up to the quenched minimal-scale theorem (Chapter 5). The supporting
    library also includes finite-exponent cube Calderón-Zygmund, Sobolev,
    fractional-Sobolev, and local coarse-graining theory. Every theorem stated in
    the manuscript is formalized; narrower or extra-hypothesis cases are flagged
    in manuscript footnotes. The two main results are exposed publicly in
    Homogenization/Book/MainResults.lean; five statements are additionally
    checked by the Lean comparator (Audit/): the fixed-exponent quenched
    comparison and four specializations.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "Homogenization.Book.MainResults.annealedConvergence_uniformEllipticity"
      file: "Homogenization/Book/MainResults.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: ""
      literature_dependencies: []
    - declaration: "Homogenization.Book.MainResults.homogenizationComparison_uniformEllipticity"
      file: "Homogenization/Book/MainResults.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Audit/QuenchedComparison/comparator.json"
      literature_dependencies: []
    - declaration: "Homogenization.StatementAudit.homogenizationComparison_uniformEllipticity"
      file: "Audit/QuenchedComparison/Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Audit/QuenchedComparison/comparator.json"
      literature_dependencies: []

automation:
  methods:
    - method: "agent"
      models:
        - "claude-opus-4-6"
        - "claude-opus-4-7"
        - "claude-opus-4-8"
        - "claude-fable-5"
        - "claude-opus-5"
        - "gpt-5.5"
      framework: "Claude Code (Anthropic) and Codex (OpenAI) agentic coding harnesses"
      tool_setup: >-
        Lake builds under leanprover/lean4:v4.33.0 with Mathlib v4.33.0 (commit
        db584cd6d46c92f209a44c0f1c829460d327499d). The Lean comparator was run
        locally on all five pairs (comparator commit
        575674928e239f5bc452aab72d1dd7b0f1326494, lean4export tag v4.33.0 =
        commit 15f6055e299ad5b89345e533cc2192f4cc00f659, landrun 0.1.18 = commit 811cfff51ceaf3d9843708aa6d22e9b84ccac8b4), and
        additionally with the independent nanoda kernel (nanoda_lib 0.4.15 =
        commit 6ae1f0cd962f081f6c423454c5da729d841236a7), which the
        .github/workflows/comparator.yml workflow enables on every push. Multiple
        read-only subagents were used for internal audit of theorem dependency
        order, definition faithfulness, challenge/solution alignment, and release
        documentation. Release preparation additionally enforced a tracked-file
        allowlist, private-name and pathname gates, and warning-free production
        builds.
      cost:
        wall_time: "not separately tracked"
        spend_usd: "≈ $1000 (ChatGPT Pro and Claude Max subscriptions)"
        hardware: "the authors' laptops plus an 8-CPU / 32 GB RAM Ubuntu machine"
      prompting_notes: >-
        Human-directed agent work, closely supervised by the authors.
  spend_usd: "≈ $1000 (ChatGPT Pro and Claude Max subscriptions)"
  notes: >-
    All Lean code in this repository was written by the listed models under the
    close supervision of the authors. Every proof is checked by the Lean kernel
    and Mathlib; the verified library contains no sorry and no custom axiom. The
    Mathlib-only comparator challenge files (Audit/*/Challenge.lean) each
    contain exactly one intentional statement-level sorry (the theorem body),
    which is filled by the corresponding Audit/*/Solution.lean and confirmed by
    leanprover/comparator ("Lean default kernel accepts the solution" / "Your
    solution is okay!").

fidelity:
  divergences: >-
    Where a formalized statement is less general than the manuscript or carries an
    additional hypothesis, this is flagged in a manuscript footnote. Substantive
    cases: a W^{2,q} estimate formalized only for q=2; the cube-wise Besov pairing
    only for p=2; a Caccioppoli iteration on the normalized interval [1/3,1];
    deterministic domains taken bounded-open-convex rather than Lipschitz; integer
    moment exponent xi>2d; one Chapter-5 statement with extra hypothesis alpha<t
    and conclusion at exponent alpha/8. The public MainResults file
    additionally specializes to uniform ellipticity using an internal
    dual-Besov quantity. The general quenched comparator proves the consequence
    for the classical H^{3/4} dual, with Euclidean Gagliardo plus scaled L2 test
    norm and componentwise vector dual norms. Its force uses the equivalent
    sup-distance Gagliardo seminorm. The comparator fixes the public exponents
    t=1/8, s=3/4 and exposes the homogenized coefficient as an existential
    positive scalar. Relative to the published paper (the journal
    article among the sources above), the formalization additionally assumes the
    coefficient law is isotropic, which that paper does not require.

review:
  status: "author-verified"
  reviewers:
    - "Scott Armstrong"
    - "Tuomo Kuusi"
  notes: >-
    Correctness of every proof is guaranteed by the Lean kernel and Mathlib (no
    sorry, no custom axiom). The authors reviewed that the public statements are
    the intended theorems; the fixed-exponent comparator corollary was
    independently checked by leanprover/comparator and by multiple read-only audit
    subagents. This is not external peer review.

alignment:
  namespace: "Homogenization"
  statements:
    - source: "Theorem t.annealed.convergence (uniformly elliptic specialization)"
      lean: "Homogenization.Book.MainResults.annealedConvergence_uniformEllipticity"
      module: "Homogenization.Book.MainResults"
      status: "proved"
      note: "Uniform ellipticity supplies the manuscript coarse-grained ellipticity hypotheses."
    - source: "Theorem t.quenched.homogenization.comparison (uniformly elliptic, fixed-exponent corollary)"
      lean: "Homogenization.Book.MainResults.homogenizationComparison_uniformEllipticity"
      module: "Homogenization.Book.MainResults"
      status: "proved"
      note: "Comparator-audited via Audit/QuenchedComparison/{Challenge,Solution}.lean."
    - source: "Mathlib-only challenge for the fixed-exponent quenched corollary"
      lean: "Homogenization.StatementAudit.homogenizationComparison_uniformEllipticity"
      module: "Audit.QuenchedComparison.Challenge / Audit.QuenchedComparison.Solution"
      status: "comparator-checked"
      note: "Challenge imports only Mathlib and contains one intentional theorem-body sorry."

