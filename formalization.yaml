status:
  scope: >-
    A Lean 4 / Mathlib formalization of the coarse-graining approach to
    quantitative stochastic homogenization of divergence-form elliptic equations:
    function-space, deterministic, probabilistic, and homogenization-scale theory
    up to the quenched minimal-scale theorem (Chapter 5), together with the
    high-contrast development: block-variance decay and the polynomial
    homogenization length scale (dimension d > 2, uniform ellipticity), from
    Armstrong-Kuusi-Loher, Homogenization at a polynomial scale in high
    contrast (to appear). The supporting library also includes finite-exponent
    cube Calderón-Zygmund, Sobolev, fractional-Sobolev, and local
    coarse-graining theory. Every theorem stated in
    the manuscript is formalized; narrower or extra-hypothesis cases are flagged
    in manuscript footnotes. The two main results are exposed publicly in
    Homogenization/Book/MainResults.lean and the polynomial-scale theorem in
    Homogenization/HighContrast/Scale/Final.lean; seven statements are
    additionally checked by the Lean comparator (Audit/): the fixed-exponent
    quenched comparison and four specializations, and the polynomial
    homogenization scale in general form and instantiated on the Bernoulli
    checkerboard law.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "Homogenization.Book.MainResults.annealedConvergence_uniformEllipticity"
      file: "Homogenization/Book/MainResults.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: ""
      literature_dependencies: []
    - declaration: "Homogenization.Book.MainResults.homogenizationComparison_uniformEllipticity"
      file: "Homogenization/Book/MainResults.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Audit/QuenchedComparison/comparator.json"
      literature_dependencies: []
    - declaration: "Homogenization.StatementAudit.homogenizationComparison_uniformEllipticity"
      file: "Audit/QuenchedComparison/Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Audit/QuenchedComparison/comparator.json"
      literature_dependencies: []
    - declaration: "Homogenization.homogenizationScale_polynomial_of_unitRange"
