name: Comparator audit

# Runs the official leanprover/comparator on all seven Audit/<X> pairs:
# for each pair it checks that Solution proves a statement whose full
# dependency closure matches Challenge's, uses only the permitted axioms,
# and is accepted by BOTH the Lean kernel (replay) and the independent
# nanoda kernel (enable_nanoda in each comparator.json).
#
# Mathlib olean artifacts come from `lake exe cache get`. The project's own
# build is cached between runs; the FIRST run on an empty cache builds the
# whole Homogenization library and may take several hours on a hosted
# runner — trigger it via workflow_dispatch, or switch `runs-on` to a
# self-hosted runner to seed the cache.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: comparator-${{ github.ref }}
  cancel-in-progress: false

env:
  COMPARATOR_REV: "5756749"      # leanprover/comparator commit
  LEAN4EXPORT_REV: "v4.26.0"     # MUST match ./lean-toolchain
  NANODA_REV: "6ae1f0c"          # ammkrn/nanoda_lib commit
  LANDRUN_REV: "811cfff"         # Zouuup/landrun commit (v0.1.18)

jobs:
  comparator:
    runs-on: ubuntu-latest       # switch to [self-hosted, linux] to seed the first cache faster
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache elan toolchains
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ hashFiles('lean-toolchain') }}-cmp-${{ env.COMPARATOR_REV }}

      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache project build artifacts
        uses: actions/cache@v4
        with:
          path: .lake/build
          key: lake-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Get Mathlib cache
        run: lake exe cache get

      - name: Build the library and the audit surfaces
        run: lake build Audit

      - name: Cache verification tools
        id: tools-cache
        uses: actions/cache@v4
        with:
          path: ~/tools
          key: cmp-tools-${{ env.COMPARATOR_REV }}-${{ env.LEAN4EXPORT_REV }}-${{ env.NANODA_REV }}-${{ env.LANDRUN_REV }}

      - name: Build comparator
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/leanprover/comparator ~/tools/comparator
          git -C ~/tools/comparator checkout "$COMPARATOR_REV"
          cd ~/tools/comparator && lake build

      - name: Build lean4export (toolchain-matched)
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/leanprover/lean4export ~/tools/lean4export
          git -C ~/tools/lean4export checkout "$LEAN4EXPORT_REV"
          test "$(cat ~/tools/lean4export/lean-toolchain)" = "$(cat lean-toolchain)" \
            || { echo "lean4export toolchain does not match project toolchain"; exit 1; }
          cd ~/tools/lean4export && lake build

      - name: Set up Go (for landrun)
        if: steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build landrun (static)
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/Zouuup/landrun ~/tools/landrun-src
          git -C ~/tools/landrun-src checkout "$LANDRUN_REV"
          mkdir -p ~/tools/bin
          cd ~/tools/landrun-src && CGO_ENABLED=0 go build -o ~/tools/bin/landrun ./cmd/landrun

      - name: Build nanoda
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install stable --profile minimal
          git clone https://github.com/ammkrn/nanoda_lib ~/tools/nanoda_lib
          git -C ~/tools/nanoda_lib checkout "$NANODA_REV"
          cd ~/tools/nanoda_lib && cargo +stable build --release

      - name: Enable the nanoda kernel check (CI-only, on the workspace copy)
        # The committed configs set enable_nanoda: false so that local
        # reproduction needs only three tools; CI always exercises the
        # stronger two-kernel variant on its throwaway checkout.
        run: sed -i 's/"enable_nanoda": false/"enable_nanoda": true/' Audit/*/comparator.json

      - name: Run the comparator on all seven pairs
        env:
          COMPARATOR_LANDRUN: /home/runner/tools/bin/landrun
          COMPARATOR_LEAN4EXPORT: /home/runner/tools/lean4export/.lake/build/bin/lean4export
          COMPARATOR_NANODA: /home/runner/tools/nanoda_lib/target/release/nanoda_bin
        run: |
          set -euo pipefail
          fail=0
          for X in QuenchedComparison PeriodicGeneral PeriodicConcrete PeriodicSmooth \
                   RandomCheckerboard PolynomialScale CheckerboardScale; do
            echo "::group::$X"
            if lake env ~/tools/comparator/.lake/build/bin/comparator "Audit/$X/comparator.json" \
                 | tee "/tmp/comparator-$X.log" \
               && grep -q "Your solution is okay!" "/tmp/comparator-$X.log"; then
              echo "$X: OK"
            else
              echo "$X: FAILED"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit "$fail"

      - name: Upload comparator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comparator-logs
          path: /tmp/comparator-*.log
